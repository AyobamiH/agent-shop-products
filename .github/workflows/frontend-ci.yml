name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "catalog/**"
      - "products/**"
      - "scripts/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/deploy-agent-shop-cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "catalog/**"
      - "products/**"
      - "scripts/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SITE_ORIGIN: https://agent-catalogue.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AyobamiH/design.md
          ref: 9bf8eae67128b6cc55ad9bf86665767deb4c11cd
          path: .design-reference
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate Google DESIGN.md contract
        working-directory: .design-reference
        run: |
          bun install --frozen-lockfile
          bun run packages/cli/src/index.ts lint ../frontend/DESIGN.md
      - name: Install
        run: bun install --frozen-lockfile
      - name: Canonical catalogue and capability inventory
        working-directory: .
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/validate_capability_inventory.py
      - name: Sync canonical catalogue
        run: |
          bun run sync:catalog
          git diff --exit-code -- catalog/products.public.json catalog/source.json catalog/capability-inventory.json catalog/capability-acquisition.json catalog/agentic-coding-bugs.json
      - name: Production build
        run: bun run build
      - name: Cloudflare Worker dry run
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Browser dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Build Node preview for browser E2E
        run: NITRO_PRESET=node_server bun run build
      - name: Start Node preview
        run: |
          PORT=8080 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/agent-catalogue-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/agents >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent-catalogue-preview.log
          exit 1
      - name: Browser E2E
        run: bun run e2e
