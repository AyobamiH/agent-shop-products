name: Deploy Agent Shop Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "catalog/**"
      - "products/**"
      - ".github/workflows/deploy-agent-shop-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: agent-shop-workers-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ACCEPTANCE_ORIGIN: https://agent-shop.woeinvests.workers.dev
      VITE_SITE_ORIGIN: https://agent-shop.woeinvests.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check Cloudflare deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured for this repository."
          fi
      - name: Install
        if: steps.credentials.outputs.available == 'true'
        run: bun install --frozen-lockfile
      - name: Build canonical acceptance artifact
        if: steps.credentials.outputs.available == 'true'
        run: bun run build
      - name: Validate Worker bundle
        if: steps.credentials.outputs.available == 'true'
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Deploy agent-shop Worker
        if: steps.credentials.outputs.available == 'true'
        run: bunx wrangler@4.135.0 deploy --config wrangler.jsonc
      - name: Wait for acceptance origin
        if: steps.credentials.outputs.available == 'true'
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --location "$ACCEPTANCE_ORIGIN/agents" >/dev/null; then
              echo "Acceptance origin is reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Acceptance origin did not become reachable."
          exit 1
      - name: Outside-in agent and crawler acceptance
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/verify-deployed-surface.mjs
      - name: Deployment status
        run: |
          if [ "${{ steps.credentials.outputs.available }}" = "true" ]; then
            echo "Agent shop acceptance deployment completed and passed outside-in verification."
          else
            echo "Agent shop acceptance deployment was not attempted because repository Cloudflare credentials are unavailable."
          fi
