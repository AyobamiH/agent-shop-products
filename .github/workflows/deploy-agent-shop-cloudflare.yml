name: Deploy Agent Shop Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-shop-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      ACCEPTANCE_ORIGIN: https://agents.proofandstate.com
      VITE_SITE_ORIGIN: https://agents.proofandstate.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured in this repository before running the canonical deployment workflow."
            exit 1
          fi
          echo "Cloudflare deployment credentials are available."
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build canonical production artifact
        run: bun run build
      - name: Validate Worker bundle
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Deploy agent-shop Worker
        run: bunx wrangler@4.135.0 deploy --config wrangler.jsonc
      - name: Wait for production origin
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --location "$ACCEPTANCE_ORIGIN/agents" >/dev/null; then
              echo "Production origin is reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production origin did not become reachable."
          exit 1
      - name: Wait for deployed content convergence and run outside-in acceptance
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if node scripts/verify-deployed-surface.mjs; then
              echo "Outside-in acceptance passed on attempt $attempt."
              exit 0
            fi
            echo "Public content has not converged yet; retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Public content did not converge before the acceptance deadline."
          exit 1
      - name: Deployment status
        run: echo "Agent shop production deployment completed and passed outside-in verification."
