name: Agent Shop public release parity

on:
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-shop-public-parity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify pure comparison contract
        run: node --test frontend/scripts/live-discovery-parity.node-check.mjs
      - name: Compare current main with real production HTTP surfaces
        run: node frontend/scripts/live-discovery-parity.mjs
