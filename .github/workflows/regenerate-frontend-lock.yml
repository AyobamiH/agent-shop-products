name: Regenerate frontend Bun lock

on:
  push:
    branches:
      - chore/remove-lovable-dependency
    paths:
      - "frontend/package.json"
      - ".github/workflows/regenerate-frontend-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-lovable-dependency
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile
        working-directory: frontend
        run: bun install --lockfile-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- frontend/bun.lock; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "AyobamiH"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add frontend/bun.lock
          git commit -m "Regenerate frontend Bun lockfile"
          git push origin HEAD:chore/remove-lovable-dependency
